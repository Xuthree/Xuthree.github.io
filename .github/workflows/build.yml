name: build-v50-firmware

# Pulls the upstream OpenWrt source, applies config/default.config (extracted
# from your local reference image), lets you add/remove packages via inputs,
# runs a full build, and uploads the resulting rootfs to a GitHub Release.
#
# Build takes 2-4 hours on the free ubuntu-22.04 runner due to the
# single-threaded `make -j1` rule (grub2-efi-arm and similar packages race
# otherwise).

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag (blank -> nightly-<UTC timestamp>)."
        required: false
        default: ""
      openwrt_version:
        description: "OpenWrt tag to build (e.g. v25.12.5)."
        required: false
        default: "v25.12.5"
      add_packages:
        description: >-
          Space-separated package names to enable on top of config/default.config.
          Example: "luci-app-dockerman luci-app-aria2".
        required: true
        default: "luci-app-mihomo luci-app-momo luci-app-samba4 luci-app-adguardhome luci-app-zerotier luci-app-tailscale luci-app-ttyd luci-app-netdata luci-app-nlbwmon luci-app-rclone luci-app-haproxy-tcp luci-theme-footstrap btop tmux screen vim auto-core automount block-mount irqbalance sysinfo iperf3 luci-i18n-mihomo-zh-cn luci-i18n-momo-zh-cn luci-i18n-samba4-zh-cn luci-i18n-adguardhome-zh-cn luci-i18n-zerotier-zh-cn luci-i18n-tailscale-zh-cn luci-i18n-ttyd-zh-cn luci-i18n-netdata-zh-cn luci-i18n-nlbwmon-zh-cn luci-i18n-rclone-zh-cn"
      remove_packages:
        description: >-
          Space-separated package names to disable from config/default.config.
          Example: "luci-app-nikki luci-app-ua3f hiddify-core".
        required: true
        # NOTE: space-separated. A comma-separated value used to slip through as
        # a single "package name" and silently remove nothing.
        default: "luci-app-passwall2 luci-theme-aurora"
      prerelease:
        description: "Mark the new release as a pre-release?"
        required: false
        type: choice
        default: "true"
        options:
          - "true"
          - "false"

  schedule:
    # Weekly Monday 02:00 UTC
    - cron: "0 2 * * 1"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360   # 6h headroom; full -j1 build is ~2-4h

    env:
      # `schedule` runs carry no `inputs` context, so every input gets a
      # fallback here (an empty openwrt_version would make the wget below fetch
      # ".../refs/tags/" and fail immediately). Passing inputs through env also
      # keeps user-supplied text out of the generated shell script.
      OPENWRT_VERSION: ${{ inputs.openwrt_version || 'v25.12.5' }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      ADD_PACKAGES: ${{ inputs.add_packages }}
      REMOVE_PACKAGES: ${{ inputs.remove_packages }}
      PRERELEASE: ${{ inputs.prerelease || 'true' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # config/ only exists on the `test` branch, so pin the ref the
          # workspace is built from: a manual run started from another branch,
          # or the scheduled run (which always uses the default branch), would
          # otherwise get a workspace without config/ and fail at
          # "Apply default config".
          # Drop this line once config/ lives on the default branch.
          ref: test

      - name: Verify repo layout
        run: |
          echo "ref=${{ github.ref }}  event=${{ github.event_name }}  sha=${{ github.sha }}"
          echo "workspace=$GITHUB_WORKSPACE"
          ls -la "$GITHUB_WORKSPACE"
          missing=0
          for f in config/default.config config/feeds.conf; do
            if [ -f "$GITHUB_WORKSPACE/$f" ]; then
              echo "OK   $f ($(stat -c%s "$GITHUB_WORKSPACE/$f") bytes)"
            else
              echo "::error::$f is missing from the workspace"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1

      - name: Show disk + memory
        run: |
          echo "=== Disk free ==="
          df -h "$GITHUB_WORKSPACE"
          echo "=== Memory ==="
          free -h
          echo "=== CPUs ==="
          nproc

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison gperf gawk \
            git wget unzip rsync subversion gettext \
            libncurses-dev libssl-dev zlib1g-dev \
            python3 python3-setuptools python3-pyelftools \
            xxd zstd file ccache

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          # run_id in the key keeps saving a fresh cache every run (a fixed key
          # would stop updating once it hits); restore-keys picks up the most
          # recent one for this version.
          key: ccache-${{ env.OPENWRT_VERSION }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ env.OPENWRT_VERSION }}-
            ccache-

      - name: Configure ccache
        run: |
          echo "=== ccache config ==="
          ccache --version
          ccache --show-config
          ccache --show-stats
          mkdir -p ~/.ccache
          # OpenWrt picks up ccache via CONFIG_DEVEL_CCACHE; we also
          # pre-set CC so the build shell uses it directly.
          echo "CCACHE_DIR=$HOME/.ccache" >> "$GITHUB_ENV"
          echo "CCACHE_MAXSIZE=2G" >> "$GITHUB_ENV"
          echo "CCACHE_COMPRESS=1" >> "$GITHUB_ENV"

      - name: Cache OpenWrt download directory
        uses: actions/cache@v4
        with:
          path: openwrt/dl
          key: openwrt-dl-${{ env.OPENWRT_VERSION }}
          restore-keys: |
            openwrt-dl-

      - name: Download OpenWrt source
        run: |
          set -e
          wget -q "https://codeload.github.com/openwrt/openwrt/tar.gz/refs/tags/${OPENWRT_VERSION}" \
            -O openwrt.tar.gz
          mkdir -p openwrt
          tar xzf openwrt.tar.gz -C openwrt --strip-components=1
          rm openwrt.tar.gz
          echo "Source root: $(ls openwrt | head -3)"
          cat openwrt/version

      - name: Merge additional feeds + update + install
        run: |
          set -e
          cd openwrt

          # Combine upstream feeds.conf.default with our repo's config/feeds.conf
          # (passwall2 + luci-theme-aurora third-party feeds).
          cp feeds.conf.default feeds.conf
          echo '' >> feeds.conf
          echo '# --- appended by openwrt-v50-builder (config/feeds.conf) ---' >> feeds.conf

          # Explicit check: the old `... || true` here swallowed the same
          # missing-config error that later blew up in "Apply default config".
          FEEDS_CONF="$GITHUB_WORKSPACE/config/feeds.conf"
          if [ ! -f "$FEEDS_CONF" ]; then
            echo "::error::$FEEDS_CONF is missing — check the run's ref / checkout settings."
            ls -la "$GITHUB_WORKSPACE"
            ls -la "$GITHUB_WORKSPACE/config" || true
            exit 1
          fi

          before=$(wc -l < feeds.conf)
          # `|| true` stays only for the corner case where every line of
          # config/feeds.conf is a comment (grep -v then exits 1).
          grep -v '^#' "$FEEDS_CONF" | grep -v '^$' >> feeds.conf || true
          after=$(wc -l < feeds.conf)
          echo "config/feeds.conf contributed $((after - before)) line(s)"
          echo '=== feeds.conf ==='
          cat feeds.conf

          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Apply default config + user inputs
        run: |
          set -e
          CFG="$GITHUB_WORKSPACE/config/default.config"
          if [ ! -f "$CFG" ]; then
            echo "::error::$CFG is missing — check the run's ref / checkout settings."
            ls -la "$GITHUB_WORKSPACE"
            ls -la "$GITHUB_WORKSPACE/config" || true
            exit 1
          fi
          cp "$CFG" openwrt/.config
          echo "Default config: $(grep -c '^CONFIG_PACKAGE_.*=y' openwrt/.config) packages enabled"

          if [ -n "$ADD_PACKAGES" ]; then
            echo "Adding: $ADD_PACKAGES"
            # word splitting is intended here
            for pkg in $ADD_PACKAGES; do
              echo "CONFIG_PACKAGE_${pkg}=y" >> openwrt/.config
            done
          fi

          if [ -n "$REMOVE_PACKAGES" ]; then
            echo "Removing: $REMOVE_PACKAGES"
            for pkg in $REMOVE_PACKAGES; do
              if grep -q "^CONFIG_PACKAGE_${pkg}=y" openwrt/.config; then
                sed -i "s/^CONFIG_PACKAGE_${pkg}=y/# CONFIG_PACKAGE_${pkg} is not set/" openwrt/.config
                echo "  disabled $pkg"
              else
                echo "::warning::$pkg is not enabled in the config (typo, or not space-separated?)"
              fi
            done
          fi

          # Resolve dependencies / fill in defaults
          make -C openwrt defconfig

          echo "=== Final package count ==="
          grep -c '^CONFIG_PACKAGE_.*=y' openwrt/.config || true
          echo "=== Target summary ==="
          grep '^CONFIG_TARGET_' openwrt/.config | grep -v '^#' || true

      - name: Build (single-threaded, verbose tail)
        run: |
          cd openwrt
          # -j1 is mandatory per the skill rules (grub2-efi-arm races otherwise).
          # `set +e` so we capture the tail even on failure for diagnostics.
          set +e
          make -j1 V=s 2>&1 | tee build.log | tail -1500
          echo "Build rc: ${PIPESTATUS[0]}"

      - name: Locate output image(s)
        id: locate
        run: |
          set -e
          echo "=== bin/targets listing ==="
          find openwrt/bin/targets -maxdepth 3 -type f 2>/dev/null | sort
          echo
          echo "=== .img files ==="
          mapfile -t IMGS < <(find openwrt/bin -name "*.img*" -type f 2>/dev/null | sort)
          if [ ${#IMGS[@]} -eq 0 ]; then
            echo "::error::no .img* output produced"
            exit 1
          fi
          for img in "${IMGS[@]}"; do
            sz=$(stat -c%s "$img")
            echo "  $img  ($((sz/1024/1024)) MB)"
          done
          # Default pick: ext4-rootfs, fallback to first .img
          PRIMARY=$(find openwrt/bin -name "*ext4*rootfs*" -type f | head -1)
          [ -z "$PRIMARY" ] && PRIMARY="${IMGS[0]}"
          echo "primary=$PRIMARY" >> "$GITHUB_OUTPUT"
          echo "Primary output: $PRIMARY"

      - name: Compress primary image
        run: |
          set -e
          IMG="${{ steps.locate.outputs.primary }}"
          if [ -z "$IMG" ] || [ ! -f "$IMG" ]; then
            echo "::error::primary image not found: $IMG"
            exit 1
          fi
          echo "Compressing: $IMG"
          gzip -c -6 "$IMG" > openwrt-final.img.gz
          ls -lh openwrt-final.img.gz
          # Also keep the raw .img next to it for users who want it un-gzipped
          cp -f "$IMG" openwrt-final.img

      - name: Generate SHA256SUMS
        run: |
          sha256sum openwrt-final.img openwrt-final.img.gz > SHA256SUMS
          cat SHA256SUMS

      - name: Resolve release tag
        id: tag
        run: |
          if [ -n "$RELEASE_TAG" ]; then
            TAG="$RELEASE_TAG"
          else
            TAG="nightly-$(date -u +%Y%m%d-%H%M%S)"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Release tag: $TAG"

      - name: Upload artifacts even if release step fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-v50-${{ steps.tag.outputs.tag }}
          path: |
            openwrt-final.img
            openwrt-final.img.gz
            SHA256SUMS

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          generate_release_notes: true
          prerelease: ${{ env.PRERELEASE }}
          files: |
            openwrt-final.img
            openwrt-final.img.gz
            SHA256SUMS
          body: |
            OpenWrt build from `${{ github.workflow }}` triggered by `${{ github.event_name }}`.

            - OpenWrt source tag: `${{ env.OPENWRT_VERSION }}`
            - Base config: `config/default.config`
            - Added packages: `${{ env.ADD_PACKAGES || '(none)' }}`
            - Removed packages: `${{ env.REMOVE_PACKAGES || '(none)' }}`
            - Build flags: `make -j1 V=s` (single-threaded)

            Files:
            - `openwrt-final.img.gz` — compressed rootfs (use this for the V50)
            - `openwrt-final.img`   — raw rootfs (for inspection)
            - `SHA256SUMS`          — checksums

            See [README](https://github.com/${{ github.repository }}#readme).
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build summary
        if: always()
        run: |
          {
            echo "## Build summary"
            echo "- OpenWrt: \`$OPENWRT_VERSION\`"
            echo "- Tag: \`${{ steps.tag.outputs.tag }}\`"
            echo "- Added: \`$ADD_PACKAGES\`"
            echo "- Removed: \`$REMOVE_PACKAGES\`"
            if [ -f openwrt-final.img.gz ]; then
              echo "- Output: $(stat -c%s openwrt-final.img.gz | numfmt --to=iec)"
            else
              echo "- Output: NOT BUILT"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
